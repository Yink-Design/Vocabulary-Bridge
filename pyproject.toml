[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ielts-vocabulary-bridge"
version = "0.1.0"
description = "Capture selected vocabulary from browsers/PDFs and add it to MaiMemo study plan."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Yink-Design"}]
dependencies = [
  "requests>=2.32,<3",
  "pynput>=1.7,<2",
  "pyperclip>=1.9,<2",
  "keyring>=25,<26",
  "pystray>=0.19,<1",
  "Pillow>=10,<12"
]

[project.scripts]
vocab-bridge = "vocab_bridge.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
